global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8001']

  - job_name: 'citizen-service'
    static_configs:
      - targets: ['citizen-service:8002']

  - job_name: 'fir-service'
    static_configs:
      - targets: ['fir-service:8003']

  - job_name: 'evidence-service'
    static_configs:
      - targets: ['evidence-service:8004']

  - job_name: 'social-media-service'
    static_configs:
      - targets: ['social-media-service:8005']

  - job_name: 'accountability-service'
    static_configs:
      - targets: ['accountability-service:8006']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:8007']

  - job_name: 'ai-engine'
    static_configs:
      - targets: ['ai-engine:8000']
