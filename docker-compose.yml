version: '3.9'

services:
  # ==========================================================================
  # Databases
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: policenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_policenet}
      POSTGRES_USER: ${POSTGRES_USER:-policenet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - policenet-network

  mongodb:
    image: mongo:7
    container_name: policenet-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-ai_policenet}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - policenet-network

  redis:
    image: redis:7-alpine
    container_name: policenet-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - policenet-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: policenet-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - policenet-network

  # ==========================================================================
  # Message Broker
  # ==========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: policenet-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - policenet-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: policenet-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - policenet-network

  # ==========================================================================
  # Backend Services
  # ==========================================================================
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: policenet-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - policenet-network

  auth-service:
    build:
      context: ./backend/authentication-service
      dockerfile: Dockerfile
    container_name: policenet-auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    networks:
      - policenet-network

  citizen-service:
    build:
      context: ./backend/citizen-service
      dockerfile: Dockerfile
    container_name: policenet-citizen-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - kafka
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_HOST=postgres
      - KAFKA_BROKERS=kafka:29092
    networks:
      - policenet-network

  fir-service:
    build:
      context: ./backend/fir-service
      dockerfile: Dockerfile
    container_name: policenet-fir-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    depends_on:
      - postgres
      - kafka
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_HOST=postgres
      - KAFKA_BROKERS=kafka:29092
    networks:
      - policenet-network

  evidence-service:
    build:
      context: ./backend/evidence-service
      dockerfile: Dockerfile
    container_name: policenet-evidence-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    depends_on:
      - postgres
      - mongodb
      - kafka
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_HOST=postgres
      - MONGODB_URI=mongodb://mongodb:27017/ai_policenet
      - KAFKA_BROKERS=kafka:29092
    networks:
      - policenet-network

  social-media-service:
    build:
      context: ./backend/social-media-service
      dockerfile: Dockerfile
    container_name: policenet-social-media-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    depends_on:
      - mongodb
      - kafka
      - elasticsearch
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - MONGODB_URI=mongodb://mongodb:27017/ai_policenet
      - KAFKA_BROKERS=kafka:29092
      - ELASTICSEARCH_HOST=elasticsearch
    networks:
      - policenet-network

  accountability-service:
    build:
      context: ./backend/accountability-service
      dockerfile: Dockerfile
    container_name: policenet-accountability-service
    restart: unless-stopped
    ports:
      - "8006:8006"
    depends_on:
      - postgres
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_HOST=postgres
    networks:
      - policenet-network

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: policenet-notification-service
    restart: unless-stopped
    ports:
      - "8007:8007"
    depends_on:
      - kafka
      - redis
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - KAFKA_BROKERS=kafka:29092
      - REDIS_HOST=redis
    networks:
      - policenet-network

  # ==========================================================================
  # AI Engine
  # ==========================================================================
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: policenet-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - mongodb
    environment:
      - KAFKA_BROKERS=kafka:29092
      - MONGODB_URI=mongodb://mongodb:27017/ai_policenet
    networks:
      - policenet-network

  # ==========================================================================
  # Frontend
  # ==========================================================================
  citizen-portal:
    build:
      context: ./frontend/citizen-portal
      dockerfile: Dockerfile
    container_name: policenet-citizen-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - policenet-network

  police-dashboard:
    build:
      context: ./frontend/police-dashboard
      dockerfile: Dockerfile
    container_name: policenet-police-dashboard
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - policenet-network

  admin-panel:
    build:
      context: ./frontend/admin-panel
      dockerfile: Dockerfile
    container_name: policenet-admin-panel
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - policenet-network

  # ==========================================================================
  # Monitoring
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: policenet-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - policenet-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: policenet-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - policenet-network

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

# ==========================================================================
# Networks
# ==========================================================================
networks:
  policenet-network:
    driver: bridge
